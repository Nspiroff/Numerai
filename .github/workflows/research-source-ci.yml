# Research Source CI — deterministic, CPU-only source-contract checks,
# split by governed platform.
#
# CI26/PX26 (Issue #26, Phase 1). This workflow validates the governed
# `numerai/agents` source tree with synthetic, mock-based unit tests only.
# It is not training, scoring, confirmation, prospective validation,
# deployment, or account authority, and a passing run grants none of those.
# Scope, module allocation, exclusions, and the known Ender26/27 POSIX
# exception-envelope divergence are documented in
# `.github/ci/research-source-scope.md`.
#
# BP26 (Issue #26, Phase 2 readiness): the `pull_request` trigger is
# deliberately path-unfiltered so that BOTH check contexts are reported on
# every pull request targeting `main`. GitHub leaves a path-skipped required
# workflow's checks in a permanent "Pending" state, which would block merging
# once these contexts become required. Push runs on `main` remain path-scoped.
# Branch protection itself is NOT enabled by this workflow; the proposed
# configuration lives in `.github/BRANCH_PROTECTION.md`.
#
# Two jobs, one contract each:
#   * `portable-source-contract` (ubuntu-24.04): in-memory compile of the
#     whole `numerai/agents` tree plus the four platform-portable
#     source-contract test modules (38 tests).
#   * `windows-terminal-custody-contract` (windows-2022): the complete,
#     unmodified Ender26 and Ender27 archived evaluator custody suites
#     (38 tests). Those terminal packets were governed and executed on
#     Windows, and their frozen tests encode the Windows `ValueError`
#     reservation-refusal envelope; on POSIX the archived bootstrap leaks
#     `FileExistsError` instead (still fail-closed CREATE_NEW custody).
#     The archived source and tests are immutable, so their contract runs
#     on the platform whose behavior they froze. No test method is
#     skipped, and no `continue-on-error` is used anywhere.
#
# Security posture:
#   * `permissions: contents: read`; checkout with
#     `persist-credentials: false`; no repository write, no secrets, no
#     Numerai API credential, no `pull_request_target`.
#   * Official GitHub actions only, pinned to immutable full commit SHAs.
#   * Fresh GitHub-hosted runners, fixed Python 3.13.14 (the sealed
#     Ender27 runtime Python), exact dependency pins from
#     `.github/ci/research-source-requirements.txt`.
#   * No GPU, no CUDA package, no local Numerai dataset, no ignored
#     artifact, no notebook execution, no canonical one-shot runner or
#     evaluator invocation, no network API operation by the tests.

name: Research Source CI

on:
  # BP26: no `paths`/`paths-ignore` here. Every PR targeting `main` —
  # documentation-only, one-file manifest, terminal-evidence, CI-only, and
  # maintenance PRs included — must emit both check contexts so they can
  # safely become required checks later. The same complete two-job platform
  # contract runs on every PR; there is no conditional job skipping, no
  # fake-success job, and no `continue-on-error`.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "numerai/agents/**"
      - ".github/workflows/research-source-ci.yml"
      - ".github/ci/**"
  workflow_dispatch:

# Group by workflow and ref; superseded source-CI runs may be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable-source-contract:
    name: "Portable compile and source-contract tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: numerai
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
      - name: Install exact CI dependency pins
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/ci/research-source-requirements.txt
          pip freeze
      - name: Compile governed numerai/agents Python tree
        run: python -c "import pathlib; files = sorted(pathlib.Path('numerai/agents').rglob('*.py')); [compile(f.read_bytes(), str(f), 'exec') for f in files]; print(f'compiled {len(files)} python files under numerai/agents')"
      - name: Run portable source-contract test modules
        # The Ender26/27 archived evaluator suites are deliberately NOT run
        # here: their frozen custody tests encode the Windows reservation
        # error envelope and run in the windows-terminal-custody-contract
        # job instead. See .github/ci/research-source-scope.md.
        run: python -m unittest -v agents.tests.test_target_transforms agents.tests.test_ender22_evaluators agents.tests.test_ender23_protocol agents.tests.test_ender24_evaluator

  windows-terminal-custody-contract:
    name: "Windows terminal evaluator custody contracts"
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONPATH: numerai
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
      - name: Install exact CI dependency pins
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/ci/research-source-requirements.txt
          pip freeze
      - name: Run complete Ender26 and Ender27 archived custody suites
        run: python -m unittest -v agents.tests.test_ender26_evaluator agents.tests.test_ender27_evaluator
