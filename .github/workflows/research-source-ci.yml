# Research Source CI — deterministic, CPU-only source-contract checks.
#
# CI26 (Issue #26, Phase 1). This workflow validates the governed
# `numerai/agents` source tree with synthetic, mock-based unit tests only.
# It is not training, scoring, confirmation, prospective validation,
# deployment, or account authority, and a passing run grants none of those.
# Scope, module selection, and exclusions are documented in
# `.github/ci/research-source-scope.md`.
#
# Security posture:
#   * `permissions: contents: read`; no repository write, no secrets, no
#     Numerai API credential, no `pull_request_target`.
#   * Official GitHub actions only, pinned to immutable full commit SHAs.
#   * Fresh GitHub-hosted Ubuntu runner, fixed Python 3.13.14 (the sealed
#     Ender27 runtime Python), exact dependency pins from
#     `.github/ci/research-source-requirements.txt`.
#   * No GPU, no CUDA package, no local Numerai dataset, no ignored artifact,
#     no notebook execution, no canonical one-shot runner or evaluator
#     invocation, no network API operation by the tests.

name: Research Source CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "numerai/agents/**"
      - ".github/workflows/research-source-ci.yml"
      - ".github/ci/**"
  push:
    branches:
      - main
    paths:
      - "numerai/agents/**"
      - ".github/workflows/research-source-ci.yml"
      - ".github/ci/**"
  workflow_dispatch:

# Group by workflow and ref; superseded source-CI runs may be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-contract:
    name: "Compile and source-contract tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: numerai
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
      - name: Install exact CI dependency pins
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/ci/research-source-requirements.txt
          pip freeze
      - name: Compile governed numerai/agents Python tree
        run: |
          python -c "import pathlib; files = sorted(pathlib.Path('numerai/agents').rglob('*.py')); [compile(f.read_bytes(), str(f), 'exec') for f in files]; print(f'compiled {len(files)} python files under numerai/agents')"
      - name: Run selected source-contract test modules
        run: |
          python -m unittest -v \
            agents.tests.test_target_transforms \
            agents.tests.test_ender22_evaluators \
            agents.tests.test_ender23_protocol \
            agents.tests.test_ender24_evaluator \
            agents.tests.test_ender26_evaluator \
            agents.tests.test_ender27_evaluator
